<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollowdeep</title>
    <meta
      name="description"
      content="An original browser-based text adventure in the spirit of Colossal Cave Adventure. A cave, a lamp, twelve treasures, and a narrator who is not on your side."
    />
    <!-- Social cards. Absolute URLs on purpose: scrapers don't resolve
         relative paths against the Pages subpath. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hollowdeep" />
    <meta
      property="og:description"
      content="An original browser-based text adventure. A cave, a lamp, twelve treasures, and a narrator who is not on your side. Play free — no install, no backend."
    />
    <meta property="og:url" content="https://dgahagan.github.io/hollowdeep/" />
    <meta
      property="og:image"
      content="https://dgahagan.github.io/hollowdeep/social-preview.jpg"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The two text voices (ui-plan §12.1): preload only the weights the
         first paint uses — narration regular + command mono regular. Italic
         and bold arrive via @font-face with font-display: swap. -->
    <link
      rel="preload"
      href="/fonts/literata-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
